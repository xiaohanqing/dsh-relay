# dsh-relay-server 部署（NAS）
#
# 1. 准备 TLS 证书（三选一，见 docs/deploy-nas.md）：
#    a) 已有证书：放到 ./certs/fullchain.pem 与 ./certs/privkey.pem
#    b) 用 certbot（本 compose 文件带了一个可选服务，走 80 端口 HTTP-01）
#    c) 测试体验（不安全，勿长期使用）：删掉下面 RELAY_TLS_CERT/RELAY_TLS_KEY
#       两个环境变量，服务端自动退化为无 TLS 模式（协议行为不变，仅少了加密层）
# 2. 启动：docker compose up -d --build
#    管理密码自动生成：docker compose logs relay | grep "admin password"
# 3. 打开管理台（手机/电脑浏览器）：http://<NAS地址>:8443/__relay/admin
#    页面上添加客户端（生成 token）、删除客户端，无需 SSH。
# 4. 路由器转发：外部 443 → NAS 8443；首次签证书还需 外部 80 → NAS 80
# 5. 各电脑的 DSH 插件设置页填：服务端地址 = 该客户端的域名，token = 管理台生成的值
#
# 也可用 CLI 管理注册表（与页面等价）：
#   docker compose run --rm relay node src/server.mjs add-client /data/clients.json <id> [domain]

services:
  relay:
    build: .
    image: dsh-relay-server
    restart: unless-stopped
    ports:
      - "8443:8443"   # 手机 + 插件入口（TLS）+ 管理台 /__relay/admin
    environment:
      RELAY_PORT: "8443"
      RELAY_CLIENTS_FILE: /data/clients.json
      RELAY_ADMIN_PASSWORD_FILE: /data/admin-password
      # 简易模式（单客户端 + 固定管理密码）：注释上面两行，改用——
      # RELAY_TOKEN: ${RELAY_TOKEN:?请在 .env 里设置 RELAY_TOKEN}
      # RELAY_ADMIN_PASSWORD: your-admin-password
      RELAY_TLS_CERT: /certs/fullchain.pem
      RELAY_TLS_KEY: /certs/privkey.pem
    volumes:
      - ./data:/data          # 注册表 + 管理密码（可写）
      - ./certs:/certs:ro

  # 可选：签发/续期 Let's Encrypt 证书（HTTP-01，需要 80 端口）
  # 首次运行：docker compose run --rm certbot certonly --standalone \
  #   -d dsh.example.com --email you@example.com --agree-tos --no-eff-email
  # 证书输出在 ./certs/live/<域名>/，把 fullchain.pem/privkey.pem 软链或复制到 ./certs/
  # 续期：crontab 里加 `docker compose run --rm certbot renew && docker compose restart relay`
  # certbot:
  #   image: certbot/certbot
  #   entrypoint: sh -c 'trap exit TERM; while :; do certbot renew --standalone; sleep 12h & wait $${!}; done'
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./certs:/etc/letsencrypt
