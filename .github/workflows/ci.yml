name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Syntax check all sources
        run: pnpm check

      - name: Build artifacts (host bundle + client bundle) and verify freshness
        run: pnpm build

      - name: Test server
        run: pnpm --filter dsh-relay-server test

      - name: Test plugin
        run: pnpm --filter dsh-relay test

      - name: Worst-case startup path (reconnect storm guard)
        run: pnpm test:worst
