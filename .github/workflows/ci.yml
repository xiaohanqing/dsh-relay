name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Syntax check all sources
        run: pnpm check

      - name: Build artifacts (host bundle + client bundle) and verify freshness
        run: pnpm build

      - name: Test server
        run: pnpm --filter dsh-relay-server test

      - name: Test plugin
        run: pnpm --filter dsh-relay test

      - name: Worst-case startup path (reconnect storm guard)
        run: pnpm test:worst

      - name: Download frp binaries for live e2e
        run: |
          curl -fsSL -o /tmp/frp.tar.gz https://github.com/fatedier/frp/releases/download/v0.71.0/frp_0.71.0_linux_amd64.tar.gz
          mkdir -p /tmp/frp-live && tar xzf /tmp/frp.tar.gz -C /tmp/frp-live --strip-components=1

      - name: frp live e2e (real frps + frpc)
        run: pnpm --filter dsh-relay run test:frp
        env:
          FRP_BIN: /tmp/frp-live
